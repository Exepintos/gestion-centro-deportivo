<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión Deportiva</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#14272e;--mute:#5d7078;--line:#d9e2e0;--side:#0f3441;--acc:#0e7c86;--ok:#17803d;--warn:#b45309;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;margin:0}
.hd{font-family:'Barlow Condensed','Barlow',sans-serif;letter-spacing:.01em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:.5rem .65rem;background:#fff;color:var(--ink)}
.inp:focus,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:var(--accink,#fff);border-radius:6px;padding:.5rem .9rem;font-weight:600}
.btn:hover{filter:brightness(.92)}
.btn2{border:1px solid var(--line);border-radius:6px;padding:.35rem .7rem;font-size:.85rem;background:#fff}
.btn2:hover{background:#f3f7f6}
.nav{display:block;width:100%;text-align:left;padding:.55rem .9rem;border-radius:6px;color:var(--sidemut,#bcd3d8);font-weight:500;white-space:nowrap}
.nav:hover{background:color-mix(in srgb,var(--sideink,#fff) 12%,transparent)}
.nav.on{background:var(--sideink,#fff);color:var(--side)}
.tag{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.78rem;font-weight:600}
.Pagado{background:#dcf5e5;color:var(--ok)}.Pendiente{background:#e6edf0;color:#3d5560}.Porvencer{background:#fdeccd;color:var(--warn)}.Vencido{background:#fde0dd;color:var(--bad)}
.chip{background:color-mix(in srgb,var(--acc) 14%,#fff);color:color-mix(in srgb,var(--acc) 65%,#000);border-radius:99px;padding:.1rem .55rem;font-size:.78rem;margin:.1rem .15rem .1rem 0;display:inline-block}
th{text-align:left;font-weight:600;color:var(--mute);font-size:.85rem;padding:.6rem .8rem;border-bottom:1px solid var(--line)}
td{padding:.65rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.al{display:block;width:100%;text-align:left;border-radius:8px;padding:.5rem .75rem;margin-bottom:.35rem;font-size:.9rem;font-weight:500}
.al.warn{background:#fdeccd;color:#8a5a00}.al.bad{background:#fde0dd;color:var(--bad)}
.al.rojo{background:#fde0dd;color:#9b1c13;border-left:4px solid #dc2626}.al.naranja{background:#ffe6d0;color:#9a4a0a;border-left:4px solid #f97316}.al.amarillo{background:#fff7c7;color:#6e5600;border-left:4px solid #eab308}
@media(max-width:767px){
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);display:flex;gap:.15rem;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 8px rgba(0,0,0,.18)}
#nav .nav{flex:1;text-align:center;font-size:.72rem;padding:.6rem .1rem}
#out{width:auto;padding:.4rem .75rem}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="min-h-screen flex items-center justify-center p-4" hidden>
  <div class="card w-full max-w-sm p-7">
    <div id="lbrand" class="flex items-center gap-3 mb-1"></div>
    <p class="mb-4" style="color:var(--mute)">Administrá alumnos, disciplinas y pagos de tu centro.</p>
    <div class="flex gap-2 mb-4"><button id="tabI" class="btn flex-1">Ingresar</button><button id="tabR" class="btn2 flex-1">Crear cuenta</button></div>
    <label class="block text-sm font-medium mb-1" for="u">Correo electrónico</label>
    <input id="u" type="email" class="inp mb-3" autocomplete="email">
    <label class="block text-sm font-medium mb-1" for="p">Contraseña</label>
    <input id="p" type="password" class="inp mb-3" autocomplete="current-password">
    <p id="lerr" class="text-sm mb-3" style="color:var(--bad)" hidden></p>
    <button id="lbtn" class="btn w-full">Ingresar</button>
    <button id="lreset" class="text-sm mt-3 underline" style="color:var(--mute)">Olvidé mi contraseña</button>
    <p id="lnote" class="text-xs mt-3" style="color:var(--mute)" hidden>Al crear tu cuenta tenés 14 días de prueba gratis. Tus datos son privados: solo vos los ves.</p>
  </div>
</section>
<section id="load" class="min-h-screen flex items-center justify-center" style="color:var(--mute)" hidden>Cargando…</section>
<section id="block" class="min-h-screen flex items-center justify-center p-4" hidden>
  <div class="card w-full max-w-md p-7 text-center"><h2 id="bt" class="hd text-3xl font-bold mb-2"></h2><p id="bm" style="color:var(--mute)"></p><button id="bout" class="btn2 mt-5">Cerrar sesión</button></div>
</section>

<!-- APP -->
<div id="app" class="min-h-screen flex flex-col md:flex-row" hidden>
  <aside class="sticky top-0 z-20 md:static justify-between md:justify-start md:w-56 md:min-h-screen p-3 md:p-4 flex md:flex-col gap-2 items-center md:items-stretch" style="background:var(--side);top:env(safe-area-inset-top,0px)">
    <div id="sbrand" class="flex items-center gap-2 md:mb-4 px-2 min-w-0"></div>
    <nav class="flex md:flex-col gap-1 flex-1 md:flex-none scroll" id="nav"></nav>
    <span id="sv" class="hidden md:block text-xs px-2 md:mt-auto" style="color:var(--sidemut,#8fb3bb)"></span>
    <div id="plan" class="hidden md:block text-xs px-2" style="color:var(--sidemut,#8fb3bb)"></div>
    <button id="out" class="nav md:mt-1 w-auto md:w-full" style="color:var(--outc,#f4b8b0)"><span class="md:hidden">Salir</span><span class="hidden md:inline">Cerrar sesión</span></button>
  </aside>
  <main class="flex-1 p-4 pb-24 md:p-8 min-w-0">
    <div id="planm" class="md:hidden text-xs text-right mb-2" style="color:var(--mute)" hidden></div>
    <div id="banner" class="mb-4 text-sm rounded-md p-3" style="background:#fdeccd;color:#8a5a00" hidden></div>
    <div id="alertas" class="mb-4" hidden></div>
    <div id="view"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(10,30,36,.55)" hidden>
  <div class="card w-full max-w-md p-6 max-h-full overflow-y-auto" id="mbox"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const today=new Date(), ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const perLabel=p=>{if(!p)return'—';const[y,m]=p.split('-');const t=new Date(y,m-1,1).toLocaleDateString('es',{month:'long',year:'numeric'});return t[0].toUpperCase()+t.slice(1)};
const fdate=f=>f?new Date(f+'T12:00:00').toLocaleDateString('es-AR'):'—';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBZV9jIqr0NPl9gF-zCNXL-iNKTfkINFkA",
  authDomain: "gestion-centro-deportivo-6994d.firebaseapp.com",
  projectId: "gestion-centro-deportivo-6994d",
  storageBucket: "gestion-centro-deportivo-6994d.firebasestorage.app",
  messagingSenderId: "350629624182",
  appId: "1:350629624182:web:f8b311d4c01e9e05712257"
};
const PRODUCTO = "Gestión Centro Deportivo";
const CONTACTO = "3865859130";
const TRIAL = 14;
const DEF = "Mi Centro Deportivo";
let S=null,uidCur=null,saveT=null,sent={};
const setStat=t=>{const e=$('#sv');if(e)e.textContent=t};
function save(){if(!uidCur||!S)return;setStat('Guardando…');clearTimeout(saveT);saveT=setTimeout(()=>{saveT=null;persist()},700)}
async function persist(){
  const {doc,setDoc,deleteDoc}=F.fs,db=F.db,u=uidCur;
  try{
    await setDoc(doc(db,'centros',u),{cfg:S.cfg,disc:S.disc,alumnos:S.alumnos,actualizado:Date.now()});
    const g={};S.pagos.forEach(p=>(g[p.periodo]=g[p.periodo]||[]).push(p));
    for(const k in g){const j=JSON.stringify(g[k]);if(sent[k]!==j){await setDoc(doc(db,'centros',u,'pagos',k),{items:g[k]});sent[k]=j}}
    for(const k in sent)if(!g[k]){await deleteDoc(doc(db,'centros',u,'pagos',k));delete sent[k]}
    setStat('Guardado')
  }catch(e){
    if(e.code==='permission-denied')block('Acceso suspendido','Tu acceso está suspendido. Tus datos siguen guardados. '+CONTACTO);
    else setStat('Error al guardar: revisá tu conexión')}
}
window.addEventListener('beforeunload',e=>{if(saveT){e.preventDefault();e.returnValue=''}});

let view='dash',filt={estado:'',periodo:''},dm=ym(today),tmpLogo='';
const NAV=[['dash','Resumen'],['alumnos','Alumnos'],['disc','Disciplinas'],['pagos','Pagos'],['cfg','Configuración']];
const alumno=id=>S.alumnos.find(a=>a.id===id);
const disc=id=>S.disc.find(d=>d.id===id);
const dias=f=>Math.round((new Date(f+'T12:00:00')-new Date(iso(today)+'T12:00:00'))/864e5);
const estado=p=>{if(p.pagado)return'Pagado';const d=dias(p.vence);return d<0?'Vencido':d<=cfgA().pv.dias?'Por vencer':'Pendiente'};
const cls=e=>e.replace(' ','');
const tag=e=>`<span class="tag ${cls(e)}">${e}</span>`;
const deuda=a=>S.pagos.filter(p=>p.alumno===a.id&&estado(p)==='Vencido');
const activo=a=>a.insc.length>0&&!deuda(a).some(p=>dias(p.vence)<-30);

/* ---------- marca ---------- */
function brand(){
  $('#lbrand').innerHTML=`<span class="hd text-4xl font-bold" style="color:var(--ink)">${esc(PRODUCTO)}</span>`;
  applyTheme();if(!S){document.title=PRODUCTO;return}
  const n=esc(S.cfg.nombre),l=S.cfg.logo?`<img src="${S.cfg.logo}" alt="" class="h-10 w-10 object-contain rounded bg-white p-0.5">`:'';
  $('#sbrand').innerHTML=l+`<span class="hd text-2xl font-bold truncate" style="color:var(--sideink,#fff)">${n}</span>`;
  document.title=S.cfg.nombre+' · Gestión';
}

/* ---------- acceso (Firebase) ---------- */
let F={},mode='in',trialLeft=null;
const show=id=>['login','load','block','app'].forEach(k=>$('#'+k).hidden=k!==id);
const block=(t,m)=>{$('#bt').textContent=t;$('#bm').textContent=m;show('block')};
const FERR={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.','auth/email-already-in-use':'Ese correo ya tiene una cuenta. Probá ingresar.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/invalid-email':'El correo no es válido.','auth/too-many-requests':'Demasiados intentos. Esperá unos minutos.','auth/network-request-failed':'Sin conexión. Revisá tu internet.'};
const lerr=m=>{$('#lerr').textContent=m;$('#lerr').hidden=!m};
function setMode(m){mode=m;$('#tabI').className=m==='in'?'btn flex-1':'btn2 flex-1';$('#tabR').className=m==='reg'?'btn flex-1':'btn2 flex-1';$('#lbtn').textContent=m==='in'?'Ingresar':'Crear cuenta';$('#lnote').hidden=m!=='reg';$('#p').autocomplete=m==='in'?'current-password':'new-password';lerr('')}
$('#tabI').onclick=()=>setMode('in');$('#tabR').onclick=()=>setMode('reg');
$('#lbtn').onclick=async()=>{lerr('');const e=$('#u').value.trim(),p=$('#p').value;if(!e||!p){lerr('Completá el correo y la contraseña.');return}
  try{mode==='in'?await F.signIn(F.auth,e,p):await F.signUp(F.auth,e,p)}catch(x){lerr(FERR[x.code]||'No se pudo completar la acción. Intentá de nuevo.')}};
$('#p').onkeydown=e=>{if(e.key==='Enter')$('#lbtn').click()};
$('#lreset').onclick=async()=>{const e=$('#u').value.trim();if(!e){lerr('Escribí tu correo y volvé a tocar este botón.');return}
  try{await F.reset(F.auth,e);lerr('');alert('Te enviamos un correo para restablecer la contraseña.')}catch(x){lerr(FERR[x.code]||'No se pudo enviar el correo.')}};
const logout=async()=>{if(saveT){clearTimeout(saveT);saveT=null;await persist()}F.signOut(F.auth)};
$('#out').onclick=logout;$('#bout').onclick=logout;

async function initFB(){
  brand();
  if(FIREBASE_CONFIG.apiKey.startsWith('PEGAR')){block('Falta configurar Firebase','Pegá los datos de tu proyecto en FIREBASE_CONFIG, al inicio del script de index.html.');return}
  show('load');
  try{
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [a,au,fs]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
    const app=a.initializeApp(FIREBASE_CONFIG);
    F={auth:au.getAuth(app),db:fs.getFirestore(app),signIn:au.signInWithEmailAndPassword,signUp:au.createUserWithEmailAndPassword,signOut:au.signOut,reset:au.sendPasswordResetEmail,fs};
    au.onAuthStateChanged(F.auth,u=>{if(u)enter(u);else{S=null;uidCur=null;sent={};isAdmin=false;ADM=null;showPlan(null);brand();show('login');setMode(mode)}});
  }catch(e){block('No se pudo conectar','Revisá tu conexión a internet y recargá la página.')}
}
async function enter(u){
  show('load');const {doc,getDoc,setDoc,serverTimestamp}=F.fs,db=F.db;
  try{
    isAdmin=false;try{isAdmin=(await getDoc(doc(db,'admins',u.uid))).exists()}catch(e){}
    let ls=await getDoc(doc(db,'licencias',u.uid));
    if(!ls.exists()){await setDoc(doc(db,'licencias',u.uid),{email:u.email,estado:'prueba',creado:serverTimestamp()});ls=await getDoc(doc(db,'licencias',u.uid))}
    const L=ls.data(),est=L.estado,now=Date.now(),cr=L.creado&&L.creado.toDate?L.creado.toDate().getTime():now,hs=L.hasta&&L.hasta.toDate?L.hasta.toDate().getTime():null;
    const left=est==='prueba'?Math.ceil(TRIAL-(now-cr)/864e5):(est==='activo'&&hs?Math.ceil((hs-now)/864e5):null);
    if(!isAdmin){
      if(est==='suspendido')return block('Acceso suspendido','Tu acceso está suspendido. Tus datos siguen guardados y se recuperan al reactivar el servicio. '+CONTACTO);
      if(est==='prueba'&&left<=0)return block('Terminó tu prueba gratuita','Tus datos siguen guardados. Para seguir usando el sistema, activá tu plan. '+CONTACTO);
      if(est==='activo'&&hs&&left<=0)return block('Tu plan venció','Tus datos siguen guardados. Para renovar tu plan: '+CONTACTO);
      if(est!=='activo'&&est!=='prueba')return block('Acceso no disponible',CONTACTO)}
    await loadData(u.uid);
    view='dash';alertOff=false;brand();setStat('');
    showPlan(isAdmin?null:{est,left,hs});
    show('app');render();
  }catch(e){
    if(e.code==='permission-denied')block('Acceso no disponible','No tenés permiso para ver los datos. '+CONTACTO);
    else block('No se pudieron cargar los datos','Revisá tu conexión y recargá la página.')}
}
async function loadData(uid){
  const {doc,getDoc,getDocs,collection}=F.fs,db=F.db;
  const m=await getDoc(doc(db,'centros',uid)),ps=await getDocs(collection(db,'centros',uid,'pagos')),d=m.exists()?m.data():{};
  S={cfg:{nombre:DEF,logo:'',...(d.cfg||{})},disc:d.disc||[],alumnos:d.alumnos||[],pagos:[]};
  sent={};ps.forEach(x=>{const it=x.data().items||[];S.pagos.push(...it);sent[x.id]=JSON.stringify(it)});
  uidCur=uid;if(!m.exists())save();
}

/* ---------- modal ---------- */
function openModal(html){$('#mbox').innerHTML=html;$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const field=(l,h)=>`<label class="block mb-3 text-sm font-medium">${l}<div class="mt-1 font-normal">${h}</div></label>`;
const actions=ok=>`<div class="flex justify-end gap-2 mt-5"><button type="button" class="btn2" onclick="closeModal()">Cancelar</button><button class="btn">${ok}</button></div>`;

/* ---------- render ---------- */
function render(){
  $('#nav').innerHTML=(isAdmin?[...NAV,['admin','Admin']]:NAV).map(([k,l])=>`<button class="nav ${view===k?'on':''}" data-v="${k}">${k==='cfg'?'<span class="md:hidden">Ajustes</span><span class="hidden md:inline">Configuración</span>':l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  $('#view').innerHTML=({dash,alumnos:vAlumnos,disc:vDisc,pagos:vPagos,cfg:vCfg,admin:vAdmin})[view]();renderAlerts();
}
const head=(t,sub,btn)=>`<div class="flex flex-wrap items-end justify-between gap-3 mb-6"><div><h2 class="hd text-4xl font-bold">${t}</h2><p style="color:var(--mute)">${sub}</p></div>${btn||''}</div>`;
const empty=t=>`<div class="p-8 text-center" style="color:var(--mute)">${t}</div>`;

const WID=[['stats','Tarjetas de resumen'],['ing','Ingresos por mes'],['cnt','Cantidad de pagos por mes'],['est','Estado de los alumnos'],['deu','Alumnos con deuda'],['dis','Alumnos por disciplina'],['rec','Últimos movimientos']];
const vis=k=>(S.cfg.vis||{})[k]!==false;
let pers=false;
function toggleVis(k,on){S.cfg.vis=S.cfg.vis||{};S.cfg.vis[k]=on;save();render()}
const k1=n=>n>=1000?+(n/1000).toFixed(1)+'k':n;
function bars(v,l,c){const m=Math.max(1,...v),w=360/v.length;return`<svg viewBox="0 0 360 165" class="w-full" role="img" aria-label="Gráfico de barras">`+v.map((x,i)=>{const h=x/m*105,X=i*w+w*.18,W=w*.64;return`<rect x="${X}" y="${130-h}" width="${W}" height="${h}" rx="3" style="fill:${c}"/><text x="${X+W/2}" y="${124-h}" text-anchor="middle" font-size="11" style="fill:var(--ink)">${k1(x)}</text><text x="${X+W/2}" y="150" text-anchor="middle" font-size="11" style="fill:var(--mute)">${l[i]}</text>`}).join('')+`</svg>`}
const box=(t,sub,body)=>`<div class="card p-5"><h3 class="hd text-2xl font-bold">${t}</h3><p class="text-sm mb-3" style="color:var(--mute)">${sub}</p>${body}</div>`;
const meter=(n,tot)=>`<div class="h-2 rounded-full mt-1" style="background:#e3ecea"><div class="h-2 rounded-full" style="width:${n/Math.max(1,tot)*100}%;background:var(--acc)"></div></div>`;

function dash(){
  const ST=S.alumnos.map(a=>({a,...estA(a)}));
  const paid=k=>S.pagos.filter(p=>p.pagado&&(p.fecha||'').startsWith(k)),sm=l=>l.reduce((t,p)=>t+Number(p.monto),0);
  const ing=sm(paid(dm)),act=ST.filter(x=>x.k!=='Inactivo').length;
  const pv=ST.filter(x=>x.pv),dv=ST.filter(x=>x.k==='Debe cuota'),ia=ST.filter(x=>x.k==='Inactivo'),ok=ST.filter(x=>x.k==='Activo'&&!x.pv);
  const owe=l=>money(l.reduce((t,x)=>t+cuotaDe(x.a),0));
  const stat=(l,v,c,sub)=>`<div class="card p-5"><div class="text-sm" style="color:var(--mute)">${l}</div><div class="hd text-5xl font-bold mt-1" style="color:${c}">${v}</div><div class="text-sm" style="color:var(--mute)">${sub}</div></div>`;
  const [y,m]=dm.split('-').map(Number),mk=[...Array(6)].map((_,i)=>new Date(y,m-1-(5-i),1));
  const keys=mk.map(ym),lab=mk.map(d=>d.toLocaleDateString('es',{month:'short'}).replace('.','')),serI=keys.map(k=>sm(paid(k))),serC=keys.map(k=>paid(k).length);
  const es=[['Al día','Pagado',ok.length],['Por vencer','Porvencer',pv.length],['Debe cuota','Vencido',dv.length],['Inactivos','Pendiente',ia.length]];
  const deu=[...dv].sort((a,b)=>b.late-a.late).slice(0,5);
  const max=Math.max(1,...S.disc.map(d=>S.alumnos.filter(a=>a.insc.some(i=>i.d===d.id)).length));
  const rec=[...S.pagos].sort((a,b)=>(b.fecha||b.vence).localeCompare(a.fecha||a.vence)).slice(0,5);
  const W={
   stats:`<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">${stat('Alumnos activos',act,'var(--ink)',`${ia.length} inactivos · ${ST.length} en total`)}${stat('Ingresos del mes',money(ing),'var(--ok)','según fecha de pago')}${stat('Cuotas por vencer',pv.length,'#a16207',`en ${cfgA().pv.dias} días o menos · ≈ ${owe(pv)}`)}${stat('Alumnos con deuda',dv.length,'var(--bad)',`≈ ${owe(dv)} sin cobrar`)}</div>`,
   ing:box('Ingresos por mes',`Últimos 6 meses · total ${money(sm(keys.flatMap(paid)))}`,bars(serI,lab,'var(--acc)')),
   cnt:box('Cantidad de pagos por mes',`Pagos cobrados · total ${serC.reduce((a,b)=>a+b,0)}`,bars(serC,lab,'#e08a2e')),

let pAuto=true,pEdit=null;
function formPago(id){
  if(!S.alumnos.length){alert('Primero registrá al menos un alumno.');return}
  if(!S.disc.length){alert('Primero creá al menos una disciplina.');return}
  const p=id?S.pagos.find(x=>x.id===id):null,f0=iso(today),legacy=p&&!p.pagado;pEdit=p;pAuto=!p;

  ${field('Alumno',`<select name="a" id="pa" class="inp" onchange="pDiscs()">${S.alumnos.map(a=>`<option value="${a.id}" ${p&&p.alumno===a.id?'selected':''}>${esc(a.nombre)}</option>`).join('')}</select>`)}

  ${legacy?'<label class="flex items-center gap-2 text-sm font-medium mb-3"><input type="checkbox" id="pg">Ya fue pagado</label>':''}
  ${field('Recargo (ARS)',`<input name="r" id="pr" type="number" min="0" class="inp" value="${p?(p.recargo||0):0}" oninput="pAuto=false;pCalc()">`)}
  <div class="mb-3 text-sm font-medium">Descuento<div class="mt-1 font-normal">${cfgD().length?`<select id="pds" class="inp mb-2" onchange="pCalc(true)"><option value="">Sin descuento</option>${cfgD().map(d=>`<option value="${d.id}" ${p&&p.descN===d.n?'selected':''}>${esc(d.n)} (${d.t==='pct'?d.v+'%':money(d.v)})</option>`).join('')}</select>`:''}<input name="dd" id="pdd" type="number" min="0" class="inp" placeholder="Monto en ARS" value="${p?(p.desc||0):0}" oninput="if($('#pds'))$('#pds').value='';pCalc()"></div></div>
  <div id="pt" class="rounded-md p-3 text-sm" style="background:#f3f7f6"></div>
  ${actions('Guardar')}</form>`);pDiscs(p?p.discs||[]:null);

function pDiscs(sel){const a=alumno($('#pa').value);if(!pEdit)pAuto=true;
  $('#pd').innerHTML=S.disc.map(d=>{const own=a.insc.some(i=>i.d===d.id),on=sel?sel.includes(d.id):own;return`<label class="flex items-center gap-2 text-sm py-0.5"><input type="checkbox" value="${d.id}" data-p="${d.precio}" ${on?'checked':''} onchange="pCalc(true)">${esc(d.nombre)} · ${money(d.precio)}${own?'':' <span style="color:var(--mute)">(se agrega al alumno)</span>'}</label>`}).join('');pCalc(true)}
function pDate(){const f=$('#pf').value;if(f)$('#pv').value=addMes(f);pCalc(true)}
function pBase(){const c=[...document.querySelectorAll('#pd input:checked')],ids=c.map(x=>x.value);
  if(pEdit&&ids.length&&ids.length===(pEdit.discs||[]).length&&ids.every(i=>pEdit.discs.includes(i)))return Math.max(0,pEdit.monto-(pEdit.recargo||0)+(pEdit.desc||0));
  return c.reduce((t,x)=>t+Number(x.dataset.p),0)}
function pCalc(re){const a=alumno($('#pa').value),b=pBase(),f=$('#pf').value,due=dueDe(a);
  if(re&&pAuto)$('#pr').value=f?recargoDe(b,due,f):0;
  const r=Math.max(0,Number($('#pr').value)||0),ds=$('#pds')?cfgD().find(x=>x.id===$('#pds').value):null;
  if(re&&ds)$('#pdd').value=ds.t==='pct'?Math.round(b*ds.v/100):ds.v;
  const dsc=Math.min(b+r,Math.max(0,Number($('#pdd').value)||0));
  $('#pt').innerHTML=`<div class="flex justify-between"><span>Cuota</span><span>${money(b)}</span></div>`+(r?`<div class="flex justify-between" style="color:var(--warn)"><span>Recargo</span><span>${money(r)}</span></div>`:'')+(dsc?`<div class="flex justify-between" style="color:var(--ok)"><span>Descuento</span><span>−${money(dsc)}</span></div>`:'')+`<div class="flex justify-between font-semibold text-base pt-1 mt-1" style="border-top:1px solid var(--line)"><span>Total</span><span>${money(b+r-dsc)}</span></div>`+(!pEdit&&due?`<div class="text-xs mt-1" style="color:var(--mute)">Su vencimiento anterior era el ${fdate(due)}.</div>`:'')}
function addP(e,id){e.preventDefault();const f=new FormData(e.target),ids=[...document.querySelectorAll('#pd input:checked')].map(i=>i.value);
  if(!ids.length){alert('Elegí al menos una disciplina.');return false}
  const pg=id&&$('#pg')?$('#pg').checked:true,fecha=f.get('f');
  if(pg&&!fecha){alert('Indicá la fecha de pago.');return false}
  const a=alumno(f.get('a')),r=Math.max(0,Number(f.get('r'))||0),b=pBase();
  ids.forEach(d=>{if(!a.insc.some(i=>i.d===d))a.insc.push({d,h:''})});
  const dsc=Math.min(b+r,Math.max(0,Number(f.get('dd'))||0)),o=cfgD().find(x=>x.id===($('#pds')?$('#pds').value:'')),data={alumno:a.id,discs:ids,monto:b+r-dsc,recargo:r,desc:dsc,descN:dsc?(o?o.n:'Descuento'):'',fecha:pg?fecha:'',vence:f.get('v'),periodo:(fecha||f.get('v')).slice(0,7),pagado:pg};
  if(id)Object.assign(S.pagos.find(x=>x.id===id),data);else S.pagos.push({id:uid(),...data});
  save();closeModal();render();return false}
function markPaid(id){const p=S.pagos.find(x=>x.id===id);let r=recargoDe(p.monto,p.vence,iso(today));
  if(r&&!confirm(`Esta cuota está atrasada: corresponde un recargo de ${money(r)}.\nTotal a cobrar: ${money(p.monto+r)}.\n\n¿Cobrar con recargo?`)){if(!confirm('¿Cobrar la cuota SIN recargo?'))return;r=0}
  p.monto+=r;p.recargo=r;p.pagado=true;p.fecha=iso(today);p.vence=addMes(p.fecha);p.periodo=p.fecha.slice(0,7);save();render()}
function delP(id){if(!confirm('¿Eliminar este registro de pago?'))return;S.pagos=S.pagos.filter(p=>p.id!==id);save();render()}

/* ---------- Configuración ---------- */
/* ---------- alertas y recargo ---------- */
const DEFA={pv:{on:true,dias:5},venc:{on:true},largo:{on:true,dias:15}};
const cfgA=()=>{const a=(S&&S.cfg.alertas)||{};return{pv:{...DEFA.pv,...a.pv},venc:{...DEFA.venc,...a.venc},largo:{...DEFA.largo,...a.largo}}};
const DEFR={on:false,dias:5,tipo:'pct',valor:10};
const cfgR=()=>({...DEFR,...((S&&S.cfg.recargo)||{})});
function recargoDe(base,vence,fp){const r=cfgR();if(!r.on||!vence||!fp)return 0;const late=Math.round((new Date(fp+'T12:00:00')-new Date(vence+'T12:00:00'))/864e5);if(late<=0||late<r.dias)return 0;return Math.round(r.tipo==='pct'?base*r.valor/100:r.valor)}
let alertOff=false;
const cfgE=()=>({inactivo:30,...((S&&S.cfg.reglas)||{})});
const addMes=f=>{const [y,m,d]=f.split('-').map(Number),dim=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(d,dim)))};
const dueDe=a=>{const mine=S.pagos.filter(p=>p.alumno===a.id),u=mine.filter(p=>!p.pagado&&p.vence).map(p=>p.vence).sort();if(u.length)return u[0];const v=mine.filter(p=>p.vence).map(p=>p.vence).sort();return v.length?v[v.length-1]:(a.alta||'')};
const cuotaDe=a=>a.insc.reduce((t,i)=>t+(disc(i.d)?disc(i.d).precio:0),0);
function estA(a){
  const due=dueDe(a),pvd=cfgA().pv.dias;
  if(!a.insc.length)return{k:'Inactivo',due,late:0,pv:false,why:'Sin disciplinas'};
  if(!due)return{k:'Activo',due:'',late:0,pv:false,sin:true};
  const d=dias(due);
  if(d>=0)return{k:'Activo',due,late:0,pv:d<=pvd,left:d};
  return{k:-d>cfgE().inactivo?'Inactivo':'Debe cuota',due,late:-d,pv:false}
}
let filtA='';
const estTag=x=>x.k==='Activo'?'<span class="tag Pagado">Activo</span>':x.k==='Debe cuota'?'<span class="tag Vencido">Debe cuota</span>':'<span class="tag Pendiente">Inactivo</span>';
const estSub=x=>x.sin?'Sin pagos registrados':x.k==='Activo'?`Vence el ${fdate(x.due)}${x.pv?(x.left===0?' (hoy)':` (en ${x.left} d)`):''}`:x.why||`${x.late} ${x.late===1?'día':'días'} de atraso`;
function alertas(){
  const A=cfgA(),out=[],ST=S.alumnos.map(a=>({a,...estA(a)})),pl=(k,a,b)=>k===1?a:b;
  if(A.largo.on){const l=ST.filter(x=>x.k==='Debe cuota'&&x.late>=A.largo.dias).sort((a,b)=>b.late-a.late);
    l.slice(0,5).forEach(x=>out.push(['rojo',`${x.a.nombre} tiene ${x.late} ${pl(x.late,'día','días')} vencido`]));
    if(l.length>5)out.push(['rojo',`y ${l.length-5} alumno${l.length-5>1?'s':''} más con ${A.largo.dias} días o más de atraso`])}
  if(A.venc.on){const l=ST.filter(x=>x.k==='Debe cuota'&&!(A.largo.on&&x.late>=A.largo.dias)).sort((a,b)=>b.late-a.late);
    if(l.length)out.push(['naranja',`${l.length} ${pl(l.length,'alumno tiene','alumnos tienen')} la cuota vencida: ${l.slice(0,3).map(x=>`${x.a.nombre} (${x.late} d)`).join(', ')}${l.length>3?` y ${l.length-3} más`:''}`])}
  if(A.pv.on){const l=ST.filter(x=>x.pv).sort((a,b)=>a.left-b.left);
    if(l.length)out.push(['amarillo',`${l.length} ${pl(l.length,'alumno tiene','alumnos tienen')} la cuota por vencer en ${A.pv.dias} días o menos: ${l.slice(0,3).map(x=>`${x.a.nombre} (${x.left===0?'hoy':'en '+x.left+' d'})`).join(', ')}${l.length>3?` y ${l.length-3} más`:''}`])}
  return out}
function renderAlerts(){const el=$('#alertas');if(!el)return;const l=alertOff||!S?[]:alertas();el.hidden=!l.length;
  el.innerHTML=l.length?`<div class="flex justify-between items-center mb-1"><span class="text-xs font-semibold" style="color:var(--mute)">ALERTAS</span><button type="button" class="text-xs underline" style="color:var(--mute)" onclick="alertOff=true;renderAlerts()">Ocultar</button></div>`+l.map(([t,m])=>`<button type="button" class="al ${t}" onclick="goAlum()">${esc(m)}</button>`).join(''):''}
function goAlum(){filtA='';view='alumnos';render()}
function setAl(k,f,v){const a=cfgA();a[k][f]=f==='dias'?Math.max(1,Math.min(90,parseInt(v)||1)):v;S.cfg.alertas=a;save();renderAlerts()}
function setRc(f,v){const r=cfgR();r[f]=f==='on'||f==='tipo'?v:Math.max(0,Number(v)||0);if(f==='dias')r.dias=Math.round(r.dias);S.cfg.recargo=r;save()}
const numIn=(v,fn,w)=>`<input type="number" min="0" value="${v}" class="inp" style="width:${w||'4.5rem'};display:inline-block;padding:.2rem .4rem" onchange="${fn}">`;
function vAl(){const a=cfgA(),dot=c=>`<span class="inline-block h-3 w-3 rounded-full align-middle" style="background:${c}"></span>`,row=(k,t)=>`<div class="flex items-start gap-2 text-sm py-2" style="border-bottom:1px solid var(--line)"><input type="checkbox" class="mt-1" ${a[k].on?'checked':''} onchange="setAl('${k}','on',this.checked)"><span>${t}</span></div>`;
  return `<div class="card p-6 max-w-lg mt-4"><h3 class="hd text-2xl font-bold mb-1">Alertas</h3><p class="text-sm mb-2" style="color:var(--mute)">Elegí qué avisos ver arriba de la pantalla, con su color y sus días.</p>
  ${row('pv',`${dot('#eab308')} <b>Amarillo:</b> cuotas por vencer, con ${numIn(a.pv.dias,"setAl('pv','dias',this.value)")} días de anticipación.`)}
  ${row('venc',`${dot('#f97316')} <b>Naranja:</b> alumnos con la cuota vencida hace pocos días.`)}
  ${row('largo',`${dot('#dc2626')} <b>Rojo:</b> alumnos con ${numIn(a.largo.dias,"setAl('largo','dias',this.value)")} días o más de atraso, por nombre.`)}</div>`}
function setEs(v){S.cfg.reglas={inactivo:Math.max(1,Math.min(365,parseInt(v)||30))};save()}
function vEs(){const e=cfgE();return `<div class="card p-6 max-w-lg mt-4"><h3 class="hd text-2xl font-bold mb-2">Estado de los alumnos</h3><div class="text-sm space-y-2">
  <p><span class="tag Pagado">Activo</span> Tiene disciplinas y su cuota no está vencida. El vencimiento es la fecha del último pago más un mes.</p>
  <p><span class="tag Vencido">Debe cuota</span> Pasó su vencimiento y lleva hasta ${numIn(e.inactivo,"setEs(this.value)")} días de atraso.</p>
  <p><span class="tag Pendiente">Inactivo</span> No tiene disciplinas, o supera esos días de atraso. Los inactivos no generan alertas.</p>
  <p style="color:var(--mute)">Un alumno nuevo vence el día en que se anota, hasta que se registra su primer pago.</p></div></div>`}
function vRc(){const r=cfgR();
  return `<div class="card p-6 max-w-lg mt-4"><h3 class="hd text-2xl font-bold mb-1">Recargo por atraso</h3><p class="text-sm mb-2" style="color:var(--mute)">Si tu centro no cobra recargo, dejalo desactivado. Se calcula al registrar el pago y podés quitarlo en cada caso.</p>
  <div class="flex items-start gap-2 text-sm py-2"><input type="checkbox" class="mt-1" ${r.on?'checked':''} onchange="setRc('on',this.checked)"><span>Cobrar recargo a las cuotas pagadas con ${numIn(r.dias,"setRc('dias',this.value)")} días o más de atraso.</span></div>
  <div class="flex flex-wrap items-center gap-2 text-sm"><span>Recargo de</span>${numIn(r.valor,"setRc('valor',this.value)",'6rem')}<select class="inp" style="width:auto" onchange="setRc('tipo',this.value)"><option value="pct" ${r.tipo==='pct'?'selected':''}>% de la cuota</option><option value="fijo" ${r.tipo==='fijo'?'selected':''}>pesos (monto fijo)</option></select></div></div>`}
/* ---------- plan, administración y descuentos ---------- */
let isAdmin=false,ADM=null;
function showPlan(i){
  const t=!i?'':i.left===null?'Plan activo':`${i.est==='prueba'?'Prueba gratis':'Plan activo'} · ${i.left} ${i.left===1?'día':'días'}`;
  const tt=i&&i.hs?'Vence el '+new Date(i.hs).toLocaleDateString('es-AR'):'';
  ['#plan','#planm'].forEach(q=>{const e=$(q);e.textContent=t;e.title=tt;if(q==='#planm')e.hidden=!t});
  const b=$('#banner'),soon=!!i&&i.left!==null&&i.left<=7;b.hidden=!soon;
  if(soon)b.textContent=`Tu ${i.est==='prueba'?'prueba gratuita':'plan'} vence en ${i.left} ${i.left===1?'día':'días'}. ${CONTACTO}`}
const addMonths=(ms,n)=>{const d=new Date(ms),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.getTime()};
const licLeft=l=>l.estado==='prueba'?Math.ceil(TRIAL-(Date.now()-l.creado)/864e5):l.estado==='activo'&&l.hasta?Math.ceil((l.hasta-Date.now())/864e5):null;
async function loadAdm(){const {collection,getDocs}=F.fs;
  try{const q=await getDocs(collection(F.db,'licencias'));ADM=q.docs.map(x=>{const d=x.data();return{id:x.id,email:d.email||x.id,estado:d.estado,creado:d.creado&&d.creado.toDate?d.creado.toDate().getTime():0,hasta:d.hasta&&d.hasta.toDate?d.hasta.toDate().getTime():null}})}catch(e){ADM=[]}
  if(view==='admin')render()}
async function admSet(id,patch){const {doc,updateDoc,Timestamp}=F.fs,d={...patch};if(d.hasta)d.hasta=Timestamp.fromMillis(d.hasta);
  try{await updateDoc(doc(F.db,'licencias',id),d);Object.assign(ADM.find(x=>x.id===id),patch);render()}catch(e){alert('No se pudo guardar el cambio. Revisá que las reglas nuevas estén publicadas.')}}
function admAdd(id,n){const l=ADM.find(x=>x.id===id);let base=Date.now();
  if(l.estado==='activo'&&l.hasta>base)base=l.hasta;
  if(l.estado==='prueba'){const te=l.creado+TRIAL*864e5;if(te>base)base=te}
  admSet(id,{estado:'activo',hasta:addMonths(base,n)})}
function admStop(id){if(confirm('¿Suspender el acceso de este centro? Sus datos no se borran.'))admSet(id,{estado:'suspendido'})}
function vAdmin(){
  if(!isAdmin)return'';
  if(!ADM){loadAdm();return head('Administración','Centros registrados')+`<div class="card">${empty('Cargando centros…')}</div>`}
  const key=l=>l.estado==='suspendido'||licLeft(l)===null?9999:licLeft(l),L=[...ADM].sort((a,b)=>key(a)-key(b));
  const tg=l=>{const d=licLeft(l);return l.estado==='suspendido'?'<span class="tag Vencido">Suspendido</span>':d!==null&&d<=0?'<span class="tag Vencido">Vencido</span>':l.estado==='activo'?'<span class="tag Pagado">Activo</span>':'<span class="tag Porvencer">Prueba</span>'};
  const fin=l=>l.estado==='prueba'?l.creado+TRIAL*864e5:l.hasta;
  const act=L.filter(l=>l.estado==='activo'&&(licLeft(l)===null||licLeft(l)>0)).length,pru=L.filter(l=>l.estado==='prueba'&&licLeft(l)>0).length;
  return head('Administración',`${L.length} centros · ${act} con plan activo · ${pru} en prueba`,`<button class="btn2" onclick="ADM=null;render()">Actualizar</button>`)+
  `<div class="card scroll">${L.length?`<table class="w-full"><thead><tr><th>Centro (correo)</th><th>Estado</th><th>Días restantes</th><th>Vence</th><th>Agregar tiempo</th><th></th></tr></thead><tbody>${L.map(l=>{const d=licLeft(l),f=fin(l);return`<tr><td class="font-medium">${esc(l.email)}</td><td>${tg(l)}</td><td>${d===null?(l.estado==='activo'?'Sin límite':'—'):Math.max(0,d)}</td><td>${f&&l.estado!=='suspendido'?new Date(f).toLocaleDateString('es-AR'):'—'}</td><td class="whitespace-nowrap">${[[1,'+1 mes'],[3,'+3 meses'],[6,'+6 meses'],[12,'+1 año']].map(([n,t])=>`<button class="btn2" onclick="admAdd('${l.id}',${n})">${t}</button>`).join(' ')}</td><td class="text-right">${l.estado==='suspendido'?'':`<button class="btn2" style="color:var(--bad)" onclick="admStop('${l.id}')">Suspender</button>`}</td></tr>`}).join('')}</tbody></table>`:empty('Todavía no hay centros registrados.')}</div>
  <p class="text-xs mt-3" style="color:var(--mute)">Al agregar tiempo, el plan queda activo y se suma desde su vencimiento (o desde hoy si ya venció). Suspender corta el acceso sin borrar datos; para reactivar, agregá tiempo.</p>`}
const cfgD=()=>(S&&S.cfg.descuentos)||[];
function addDsc(){const n=$('#dn').value.trim(),v=Number($('#dv').value),t=$('#dt').value;
  if(!n||!(v>0)){alert('Escribí el nombre y un valor mayor a 0.');return}
  if(t==='pct'&&v>100){alert('El porcentaje no puede superar 100.');return}
  S.cfg.descuentos=[...cfgD(),{id:uid(),n,t,v}];save();render()}
function delDsc(id){S.cfg.descuentos=cfgD().filter(d=>d.id!==id);save();render()}
function vDsc(){const l=cfgD();
  return `<div class="card p-6 max-w-lg mt-4"><h3 class="hd text-2xl font-bold mb-1">Descuentos</h3><p class="text-sm mb-2" style="color:var(--mute)">Cargá los descuentos que ofrece tu centro (hermanos, cupones, etc.). Al registrar un pago elegís cuál aplicar.</p>
  ${l.length?l.map(d=>`<div class="flex justify-between items-center py-2 text-sm" style="border-bottom:1px solid var(--line)"><span><b>${esc(d.n)}</b> · ${d.t==='pct'?d.v+'%':money(d.v)}</span><button type="button" class="btn2" style="color:var(--bad)" onclick="delDsc('${d.id}')">Quitar</button></div>`).join(''):'<p class="text-sm py-2" style="color:var(--mute)">Todavía no cargaste descuentos.</p>'}
  <div class="flex flex-wrap items-center gap-2 mt-3"><input id="dn" class="inp" style="flex:1;min-width:8rem;width:auto" placeholder="Nombre (ej: Hermanos)"><input id="dv" type="number" min="0" class="inp" style="width:5.5rem" placeholder="Valor"><select id="dt" class="inp" style="width:auto"><option value="pct">%</option><option value="fijo">$</option></select><button type="button" class="btn" onclick="addDsc()">Agregar</button></div></div>`}
/* ---------- apariencia ---------- */
const DEFT={acc:'#0e7c86',side:'#0f3441',velo:85};
const PRE=[['Turquesa','#0e7c86','#0f3441'],['Azul','#2563eb','#14213d'],['Verde cancha','#15803d','#14352a'],['Naranja','#ea580c','#3a2417'],['Violeta','#7c3aed','#2e1a47'],['Rojo y negro','#dc2626','#1c1c1f'],['Rosa','#db2777','#3b1230'],['Claro','#0e7c86','#dfe9e8']];
function lum(h){const n=parseInt(h.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function applyTheme(){
  const t={...DEFT,...((S&&S.cfg.tema)||{})},r=document.documentElement.style,light=lum(t.side)>.4;
  r.setProperty('--acc',t.acc);r.setProperty('--side',t.side);
  r.setProperty('--accink',lum(t.acc)>.4?'#14272e':'#fff');
  r.setProperty('--sideink',light?'#14272e':'#fff');
  r.setProperty('--sidemut',light?'#3d5560':'#bcd3d8');
  r.setProperty('--outc',light?'#b42318':'#f4b8b0');
  const m=document.querySelector('#app main'),f=S&&S.cfg.fondo,v=t.velo/100;
  if(m){m.style.backgroundImage=f?`linear-gradient(rgba(238,242,241,${v}),rgba(238,242,241,${v})),url(${f})`:'';m.style.backgroundSize='cover';m.style.backgroundPosition='center'}
}
function setTema(o){S.cfg.tema={...DEFT,...(S.cfg.tema||{}),...o};applyTheme();save()}
function preset(i){setTema({acc:PRE[i][1],side:PRE[i][2]});$('#ca').value=PRE[i][1];$('#cs').value=PRE[i][2]}
function resetTema(){delete S.cfg.tema;applyTheme();save();render()}
function imgData(file,max,type,q,lim){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{let k=Math.min(1,max/Math.max(im.width,im.height)),qq=q,out='';for(let i=0;i<6;i++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);out=c.toDataURL(type,qq);if(out.length<=lim)break;k*=.8;qq=Math.max(.35,qq-.08)}ok(out)};im.src=r.result};r.readAsDataURL(file)})}
async function fondoUp(inp){const f=inp.files[0];if(!f)return;try{const u=await imgData(f,1100,'image/jpeg',.6,160000);S.cfg.fondo=u;$('#fp').src=u;$('#fp').hidden=false;applyTheme();save()}catch(e){alert('No se pudo cargar la imagen. Probá con otra.')}}
function quitaFondo(){S.cfg.fondo='';$('#fp').hidden=true;applyTheme();save()}
function vApar(){const t={...DEFT,...(S.cfg.tema||{})};
  return `<div class="card p-6 max-w-lg mt-4"><h3 class="hd text-2xl font-bold mb-1">Apariencia</h3>
  <p class="text-sm mb-3" style="color:var(--mute)">Elegí una combinación de colores o armá la tuya. Los cambios se guardan solos.</p>
  <div class="flex flex-wrap gap-2 mb-4">${PRE.map((p,i)=>`<button type="button" class="btn2 flex items-center gap-2" onclick="preset(${i})"><span class="flex"><span class="inline-block h-5 w-5 rounded-full" style="background:${p[1]};border:1px solid var(--line)"></span><span class="inline-block h-5 w-5 rounded-full -ml-2" style="background:${p[2]};border:1px solid var(--line)"></span></span>${p[0]}</button>`).join('')}</div>
  <div class="grid grid-cols-2 gap-3 mb-4">
    <label class="text-sm font-medium">Color principal<input id="ca" type="color" class="block mt-1 h-10 w-full cursor-pointer" value="${t.acc}" oninput="setTema({acc:this.value})"></label>
    <label class="text-sm font-medium">Color del menú<input id="cs" type="color" class="block mt-1 h-10 w-full cursor-pointer" value="${t.side}" oninput="setTema({side:this.value})"></label></div>
  <div class="text-sm font-medium mb-2">Imagen de fondo</div>
  <div class="flex items-center gap-4 mb-3"><img id="fp" ${S.cfg.fondo?`src="${S.cfg.fondo}"`:'hidden'} alt="Fondo" class="h-16 w-24 object-cover rounded" style="border:1px solid var(--line)"><div><input type="file" accept="image/*" onchange="fondoUp(this)" class="text-sm"><button type="button" class="btn2 mt-2" onclick="quitaFondo()">Quitar fondo</button></div></div>
  <label class="block text-sm font-medium">Opacidad del velo sobre el fondo<input type="range" min="40" max="95" value="${t.velo}" class="w-full" oninput="setTema({velo:+this.value})"><span class="text-xs font-normal" style="color:var(--mute)">Más alto = fondo más suave y texto más fácil de leer.</span></label>
  <button type="button" class="btn2 mt-4" onclick="resetTema()">Restablecer colores</button></div>`}
function vCfg(){const h=vCfg0(),k='<div class="card p-6 max-w-lg mt-4"><h3 class="hd text-2xl font-bold mb-1">Empezar de cero';const i=h.indexOf(k);const x=vApar()+vAl()+vEs()+vRc()+vDsc();return i<0?h+x:h.slice(0,i)+x+h.slice(i)}
function vCfg0(){tmpLogo=S.cfg.logo||'';
  return head('Configuración','Nombre, apariencia, alertas y recargos de tu establecimiento')+
  `<div class="card p-6 max-w-lg"><form onsubmit="return saveCfg(event)">
  ${field('Nombre del establecimiento',`<input name="n" required class="inp" value="${esc(S.cfg.nombre)}">`)}
  <div class="text-sm font-medium mb-2">Logo</div>
  <div class="flex items-center gap-4 mb-2"><img id="lp" ${tmpLogo?`src="${tmpLogo}"`:'hidden'} alt="Logo" class="h-20 w-20 object-contain rounded" style="border:1px solid var(--line)"><div><input type="file" accept="image/*" onchange="logoUp(this)" class="text-sm"><button type="button" class="btn2 mt-2" onclick="tmpLogo='';$('#lp').hidden=true">Quitar logo</button></div></div>
  <button class="btn mt-3">Guardar cambios</button><span id="cm" class="ml-3 text-sm" style="color:var(--ok)"></span></form></div>
  <div class="card p-6 max-w-lg mt-4"><h3 class="hd text-2xl font-bold mb-1">Empezar de cero</h3><p class="text-sm mb-3" style="color:var(--mute)">Borra todos tus alumnos, disciplinas y pagos. Se conservan el nombre y el logo.</p><button class="btn2" style="color:var(--bad)" onclick="wipe()">Borrar todos los datos</button></div>`;
}
function logoUp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpLogo=c.toDataURL('image/png');$('#lp').src=tmpLogo;$('#lp').hidden=false};im.src=r.result};r.readAsDataURL(f)}
function saveCfg(e){e.preventDefault();S.cfg.nombre=new FormData(e.target).get('n').trim()||DEF;S.cfg.logo=tmpLogo;save();brand();$('#cm').textContent='Cambios guardados'+(S.cfg.logo?'':'');return false}
function wipe(){if(!confirm('Se borrarán todos los alumnos, disciplinas y pagos. ¿Continuar?'))return;S={cfg:S.cfg,disc:[],alumnos:[],pagos:[]};save();view='dash';render()}

initFB();
</script>
</body>
